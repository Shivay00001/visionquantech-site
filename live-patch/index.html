  <script>
    function closeAuthModal() {
      const modal = document.getElementById('authModal');
      const content = document.getElementById('authModalContent');
      modal.classList.remove('opacity-100', 'pointer-events-auto');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.remove('translate-y-0');
      content.classList.add('translate-y-4');
    }

    function openAuthModal() {
      const modal = document.getElementById('authModal');
      const content = document.getElementById('authModalContent');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.classList.add('opacity-100', 'pointer-events-auto');
      content.classList.remove('translate-y-4');
      content.classList.add('translate-y-0');
    }

    // Close modal on escape
    document.addEventListener('keydown', function (event) {
      if (event.key === "Escape") closeAuthModal();
    });

    // Close modal on clicking outside content
    document.getElementById('authModal').addEventListener('click', function (e) {
      if (e.target === this) closeAuthModal();
    });

    // Handle Formspree Submission via Custom AJAX Fetch
    document.getElementById('formspreeAuthForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;
      const button = form.querySelector('button[type="submit"]');
      const originalText = button.textContent;
      button.textContent = 'Submitting...';
      button.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          form.innerHTML = `
            <div class="text-brand-cyan text-center py-8 transform transition-all">
              <svg class="w-16 h-16 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <h3 class="text-2xl font-bold font-display mb-2">Request Received!</h3>
              <p class="text-slate-300">We will reach out to you shortly.</p>
            </div>`;
          setTimeout(() => { closeAuthModal(); }, 3500);
        } else {
          alert('Oops! There was a problem submitting your request.');
          button.textContent = originalText;
          button.disabled = false;
        }
      } catch (error) {
        alert('Oops! Network error processing your request.');
        button.textContent = originalText;
        button.disabled = false;
      }
    });

          }
        }

        // Fix Logo & Image paths broken by moving to root
        if (tagName === 'img') {
          const src = node.getAttribute('src');
          if (src && (src.includes('/src/assets/images/') || src.startsWith('./assets/'))) {
            node.setAttribute('src', src.replace('/src/assets/images/', '/assets/images/').replace('./assets/', '/assets/'));
          }
          // Replace Founder Image
          if (src && src.includes('dicebear.com') && src.includes('Shivam')) {
            node.setAttribute('src', '/assets/shivam.jpg');
            // Remove the default rounded and background classes of dicebear, and add cover styling
            node.style.objectFit = 'cover';
            node.style.borderRadius = '50%';
          }
        }
      }

      // Recursively process children
      if (node.childNodes && node.childNodes.length > 0) {
        Array.from(node.childNodes).forEach(processNode);
      }
    };

    const mutationObserver = new MutationObserver((mutations) => {
      mutations.forEach(mutation => {
        if (mutation.type === 'childList') {
          mutation.addedNodes.forEach(processNode);
        } else if (mutation.type === 'characterData') {
          processNode(mutation.target);
        }
      });
    });

    // Start observing before React boots up
    mutationObserver.observe(document.body, {
      childList: true,
      subtree: true,
      characterData: true
    });

    // Process already existing nodes (usually just root)
    processNode(document.body);

  </script>
